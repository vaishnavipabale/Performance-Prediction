services:
  - type: web
    name: student-performance-prediction
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python model/generate_dataset.py && python model/train_model.py"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
